name: Keep-Alive Pinger

on:
  schedule:
    # Ping every 10 minutes to prevent Render free tier from going to sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production Server
        run: |
          echo "Pinging Vignan College ID Management Portal..."
          curl -s -f https://college-id-management.onrender.com/api/health || true
          echo "Keep-alive ping sent successfully!"

